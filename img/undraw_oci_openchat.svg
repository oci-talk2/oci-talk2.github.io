<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">함께 이야기해요</title>
  <desc id="desc">오픈채팅에서 자유롭게 질문하고 의견을 나누는 모습을 표현한 파스텔 톤 벡터 일러스트</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf5ff"/>
      <stop offset="55%" stop-color="#dff1ed"/>
      <stop offset="100%" stop-color="#cde7dc"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8bd4b8"/>
      <stop offset="100%" stop-color="#56ae8d"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8c9f0"/>
      <stop offset="100%" stop-color="#6f9fd5"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#40576a"/>
      <stop offset="100%" stop-color="#2f4355"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#7f93a6" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#fff"/>

  <!-- chat-room style background -->
  <path d="M113 445C93 343 165 270 274 228C385 185 428 94 562 73C710 51 797 101 880 161C949 211 1063 194 1116 287C1174 389 1135 535 1030 610C943 674 843 675 741 650C630 622 535 639 436 626C301 609 141 578 113 445Z"
        fill="url(#bg)"/>

  <!-- subtle room/panel shapes -->
  <g opacity="0.42">
    <rect x="99" y="350" width="248" height="220" rx="8" fill="#d7e8fa"/>
    <rect x="140" y="414" width="52" height="103" rx="8" fill="#95b9e4"/>
    <rect x="208" y="365" width="56" height="152" rx="8" fill="#88acd7"/>
    <rect x="985" y="187" width="110" height="115" rx="8" fill="#e6f2f5"/>
    <rect x="1010" y="216" width="55" height="8" rx="4" fill="#bad3df"/>
    <rect x="1010" y="236" width="42" height="8" rx="4" fill="#bad3df"/>
    <rect x="960" y="401" width="96" height="98" rx="8" fill="#e5f1ef"/>
    <rect x="982" y="430" width="50" height="8" rx="4" fill="#bdd8d1"/>
    <rect x="982" y="452" width="36" height="8" rx="4" fill="#bdd8d1"/>
  </g>

  <!-- central chat window -->
  <g transform="translate(372 150) rotate(-2)" filter="url(#shadow)">
    <rect x="0" y="0" width="490" height="530" rx="26" fill="#fff" stroke="#d7e3ea" stroke-width="3"/>
    <rect x="0" y="0" width="490" height="54" rx="26" fill="url(#dark)"/>
    <circle cx="28" cy="27" r="7" fill="#65c4a4"/>
    <circle cx="52" cy="27" r="7" fill="#bfe0d3"/>
    <circle cx="76" cy="27" r="7" fill="#91d1d8"/>

    <!-- sidebar -->
    <rect x="0" y="54" width="136" height="476" fill="#34495b"/>
    <rect x="0" y="72" width="136" height="46" fill="#3b5367"/>

    <g opacity="0.95">
      <circle cx="34" cy="91" r="16" fill="#76c9aa"/>
      <rect x="59" y="82" width="46" height="8" rx="4" fill="#668096"/>
      <rect x="59" y="96" width="35" height="7" rx="3.5" fill="#5a738a"/>

      <circle cx="34" cy="138" r="16" fill="#74c0a4"/>
      <rect x="59" y="129" width="50" height="8" rx="4" fill="#668096"/>
      <rect x="59" y="143" width="33" height="7" rx="3.5" fill="#5a738a"/>

      <circle cx="34" cy="185" r="16" fill="#a9b7c7"/>
      <rect x="59" y="176" width="46" height="8" rx="4" fill="#668096"/>

      <circle cx="34" cy="232" r="16" fill="#9eadbc"/>
      <rect x="59" y="223" width="52" height="8" rx="4" fill="#668096"/>

      <circle cx="34" cy="279" r="16" fill="#a9b7c7"/>
      <rect x="59" y="270" width="42" height="8" rx="4" fill="#668096"/>
      <rect x="59" y="284" width="30" height="7" rx="3.5" fill="#5a738a"/>

      <circle cx="34" cy="326" r="16" fill="#a4b4c3"/>
      <rect x="59" y="317" width="45" height="8" rx="4" fill="#668096"/>
      <rect x="59" y="331" width="28" height="7" rx="3.5" fill="#5a738a"/>
    </g>

    <rect x="136" y="54" width="354" height="476" fill="#f9fcfd"/>

    <!-- message 1 -->
    <g transform="translate(164 88)">
      <circle cx="28" cy="28" r="28" fill="url(#mint)"/>
      <circle cx="28" cy="20" r="9" fill="#dff2e9"/>
      <path d="M12 43c5-12 27-12 32 0" fill="#dff2e9"/>
      <rect x="66" y="0" width="190" height="64" rx="18" fill="#fff" stroke="#e2e8ed"/>
      <rect x="88" y="18" width="124" height="10" rx="5" fill="#cfd9e1"/>
      <rect x="88" y="38" width="145" height="10" rx="5" fill="#cfd9e1"/>
    </g>

    <!-- message 2: generic right-side user -->
    <g transform="translate(170 170)">
      <rect x="22" y="0" width="205" height="66" rx="18" fill="#dff3ea"/>
      <rect x="43" y="17" width="100" height="10" rx="5" fill="#9fceb9"/>
      <rect x="43" y="38" width="135" height="10" rx="5" fill="#9fceb9"/>

      <g transform="translate(275 33)">
        <circle cx="0" cy="0" r="36" fill="url(#blue)"/>
        <circle cx="0" cy="-10" r="11" fill="#e7f1fb"/>
        <path d="M-19 18c6-15 32-15 38 0" fill="#e7f1fb"/>
      </g>
    </g>

    <!-- message 3 -->
    <g transform="translate(164 263)">
      <circle cx="28" cy="28" r="28" fill="url(#blue)"/>
      <circle cx="28" cy="20" r="9" fill="#e8f1fb"/>
      <path d="M12 43c5-12 27-12 32 0" fill="#e8f1fb"/>
      <rect x="66" y="0" width="202" height="74" rx="18" fill="#fff" stroke="#e2e8ed"/>
      <rect x="83" y="16" width="58" height="42" rx="8" fill="#64b18e"/>
      <path d="M95 45c0-8 7-15 15-15 7 0 12 4 14 10 2-1 5-2 8-2 7 0 12 5 12 12H95z" fill="#fff"/>
      <rect x="154" y="18" width="85" height="9" rx="4.5" fill="#cfd9e1"/>
      <rect x="154" y="36" width="63" height="9" rx="4.5" fill="#cfd9e1"/>
      <rect x="154" y="53" width="48" height="8" rx="4" fill="#cfd9e1"/>
    </g>

    <!-- message 4 -->
    <g transform="translate(170 355)">
      <circle cx="28" cy="28" r="28" fill="url(#mint)"/>
      <circle cx="28" cy="20" r="9" fill="#dff2e9"/>
      <path d="M12 43c5-12 27-12 32 0" fill="#dff2e9"/>
      <rect x="67" y="0" width="195" height="68" rx="18" fill="#dff3ea"/>
      <rect x="88" y="18" width="130" height="10" rx="5" fill="#9fceb9"/>
      <rect x="88" y="39" width="93" height="10" rx="5" fill="#9fceb9"/>
    </g>

    <!-- input bar -->
    <rect x="158" y="455" width="310" height="48" rx="22" fill="#fff" stroke="#e1e8ed"/>
    <circle cx="184" cy="479" r="16" fill="#dce5eb"/>
    <path d="M177 479h14M184 472v14" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="441" cy="479" r="18" fill="#c8d5df"/>
    <path d="M431 479l20-10-7 20-4-8z" fill="#fff"/>
  </g>

  <!-- rounder typing bubbles -->
  <g filter="url(#shadow)">
    <g transform="translate(175 253)">
      <rect width="168" height="106" rx="44" fill="#f7fffb" stroke="#b9dfcf" stroke-width="4"/>
      <path d="M118 96l18 27 4-31" fill="#f7fffb" stroke="#b9dfcf" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="52" cy="54" r="10" fill="#3fa180"/>
      <circle cx="84" cy="54" r="10" fill="#3fa180"/>
      <circle cx="116" cy="54" r="10" fill="#3fa180"/>
    </g>

    <g transform="translate(882 225)">
      <rect width="180" height="105" rx="44" fill="#fff" stroke="#bee1d3" stroke-width="4"/>
      <path d="M34 95l-18 27 0-32" fill="#fff" stroke="#bee1d3" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="55" cy="52" r="10" fill="#3f9f80"/>
      <circle cx="90" cy="52" r="10" fill="#3f9f80"/>
      <circle cx="125" cy="52" r="10" fill="#3f9f80"/>
    </g>

    <g transform="translate(920 530)">
      <rect width="170" height="98" rx="42" fill="#fff"/>
      <path d="M34 88l-16 28 1-31" fill="#fff"/>
      <circle cx="52" cy="49" r="10" fill="#4f86c2"/>
      <circle cx="84" cy="49" r="10" fill="#4f86c2"/>
      <circle cx="116" cy="49" r="10" fill="#4f86c2"/>
    </g>
  </g>

  <!-- bot bubble -->
  <g transform="translate(900 380)" filter="url(#shadow)">
    <rect width="160" height="112" rx="40" fill="#eff6ff" stroke="#d7e6f5" stroke-width="4"/>
    <path d="M36 101l-18 27 2-33" fill="#eff6ff" stroke="#d7e6f5" stroke-width="4" stroke-linejoin="round"/>
    <rect x="48" y="35" width="66" height="48" rx="18" fill="#6588ad"/>
    <circle cx="66" cy="58" r="5" fill="#e7f1fb"/>
    <circle cx="96" cy="58" r="5" fill="#e7f1fb"/>
    <path d="M68 70c8 8 18 8 26 0" fill="none" stroke="#e7f1fb" stroke-width="4" stroke-linecap="round"/>
    <line x1="81" y1="35" x2="81" y2="22" stroke="#6588ad" stroke-width="4"/>
    <circle cx="81" cy="18" r="6" fill="#6588ad"/>
  </g>

  <!-- accent marks -->
  <g stroke="#51a989" stroke-width="8" stroke-linecap="round">
    <path d="M157 235l-23-18"/>
    <path d="M172 213l-8-29"/>
    <path d="M141 264l-30 2"/>
    <path d="M1078 350l13-27"/>
    <path d="M1100 368l24-19"/>
    <path d="M1110 394l29 3"/>
  </g>

  <!-- mug + plant -->
  <g transform="translate(95 610)">
    <ellipse cx="90" cy="115" rx="78" ry="12" fill="#dce7ec"/>
    <rect x="80" y="52" width="80" height="78" rx="8" fill="#f1f5f6"/>
    <ellipse cx="120" cy="52" rx="40" ry="8" fill="#d7e1e6"/>
    <path d="M80 72c-20-4-36 7-36 26 0 18 14 31 35 29" fill="none" stroke="#d4dee5" stroke-width="10"/>

    <rect x="170" y="72" width="88" height="66" rx="8" fill="#edf4f2"/>
    <path d="M213 75c-27-34-22-87-3-116 29 15 41 50 28 84 14-42 41-63 67-55 6 34-9 67-39 88 17-29 45-42 67-31 3 27-13 49-44 64z"
          transform="translate(-85 0)" fill="#63b99a"/>
    <path d="M179 72c-18-37-22-66-18-92M205 72c7-42 18-69 37-92M228 74c16-25 33-42 53-49"
          fill="none" stroke="#438f75" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- books -->
  <g transform="translate(824 662)" filter="url(#shadow)">
    <rect x="0" y="45" width="250" height="35" rx="10" fill="#8eb1df"/>
    <rect x="42" y="0" width="220" height="34" rx="10" fill="#63ae8f"/>
    <rect x="162" y="6" width="88" height="22" rx="4" fill="#fff"/>
    <rect x="120" y="49" width="138" height="24" rx="4" fill="#fff"/>
  </g>

  <ellipse cx="602" cy="744" rx="495" ry="18" fill="#dceeed"/>
</svg>
